name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The game links point at other repositories. Catch a dead one weekly.
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: just ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # gitleaks reads the history, not the tip: a key that was committed
          # and then deleted is still a key that was published.
          fetch-depth: 0

      # Every tool comes from mise.toml. Nothing was pinned before: the jobs
      # used whatever python3 and node the runner carried, and every Node tool
      # arrived through `npx --yes <pkg>@<major>` at run time.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
        with:
          cache: true

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      # The one command: the zero-JS guard, the generated sprites, the
      # workflows, the formatting, the audit and the accessibility suite. Four
      # of the five jobs this workflow used to carry were inline shell that
      # duplicated a recipe, or existed nowhere a developer could reach.
      - run: just ci

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Its own job because `just markup` runs a container, and the main job would
  # have to nest one to do the same. Still a recipe, so it is still something a
  # developer can run.
  markup:
    name: just markup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
        with:
          cache: true

      - run: just markup

  # lychee is an action rather than a command, so the rule that every CI command
  # must be a just recipe does not reach it. The weekly cron above is the point:
  # a sibling repository's link can rot without anyone pushing here.
  links:
    name: links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          args: >-
            --no-progress --accept 200,204,206
            --root-dir ${{ github.workspace }}
            index.html 404.html README.md
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
