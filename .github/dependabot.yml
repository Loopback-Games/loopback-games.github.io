# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json
#
# There was none of this before: the actions were pinned by commit SHA with
# nothing to bump them, which is the failure mode of pinning without automation.
#
# Tool versions in mise.toml are not covered here — Dependabot has no mise
# ecosystem. Bump those deliberately with `mise upgrade`.
version: 2
updates:
  # Grouped, because ungrouped these arrive as one pull request per action and a
  # routine round of bumps turns into five reviews of the same change.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tooling:
        patterns:
          - "*"

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
